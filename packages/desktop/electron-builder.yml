npmRebuild: false
appId: io.github.ledo9124.paseo-slp
productName: Paseo SLP
executableName: Paseo SLP
protocols:
  - name: Paseo SLP agent link
    schemes:
      - paseo-slp
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
extraMetadata:
  name: paseo-slp-desktop
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: ledo9124
  repo: paseo-slp
mac:
  artifactName: "Paseo-SLP-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo-slp
      to: bin/paseo-slp
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Paseo-SLP-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Paseo SLP"
  extraResources:
    - from: bin/paseo-slp
      to: bin/paseo-slp
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  packageName: paseo-slp
rpm:
  packageName: paseo-slp
appImage:
  # Keep the AppImage filename stable across versions (no ${version}) so
  # manually replacing the build preserves desktop shortcuts and the
  # ~/.local/bin/paseo-slp CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Paseo-SLP-${arch}.${ext}"
win:
  artifactName: "Paseo-SLP-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/paseo-slp.cmd
      to: bin/paseo-slp.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
